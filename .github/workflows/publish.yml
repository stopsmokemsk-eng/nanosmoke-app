name: Assemble and publish Nanosmoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nanosmoke-publication
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-v1
      - run: npm install
      - run: npm run build
      - name: Import descriptions and all discoverable product photos
        run: node enrich-products.mjs
      - run: python -m pip install 'rembg[cpu]==2.0.67' Pillow
      - name: Reprocess backgrounds including previously opaque PNGs
        run: python remove-backgrounds.py
      - run: node upgrade-visual.mjs
      - name: Generate separate product page and navigation
        run: node add-product-pages.mjs
      - name: Save processed site in main
        shell: bash
        run: |
          set -euo pipefail
          cp -R _site/. ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html product.html product-routes.js sw.js manifest.webmanifest catalog.json import-report.json product-import-report.json cutout-report.json icon-192.png icon-512.png assets cutouts .nojekyll visual-v2.css visual-v2.js
          if ! git diff --cached --quiet; then
            git commit -m 'Save product pages, detailed catalogue and transparent previews v3'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Detect current Pages publishing mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // "legacy"')
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.value == 'workflow'
      - uses: actions/deploy-pages@v4
        if: steps.mode.outputs.value == 'workflow'
        id: deployment
      - name: Explicitly request latest branch-based Pages build
        if: steps.mode.outputs.value == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
