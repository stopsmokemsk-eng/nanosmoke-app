name: Assemble and publish Nanosmoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nanosmoke-publication
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-v1
      - run: npm install
      - run: npm run build
      - name: Install background segmentation
        run: python -m pip install 'rembg[cpu]==2.0.67' Pillow
      - name: Create transparent PNG cutouts while retaining originals
        run: python remove-backgrounds.py
      - name: Enlarge objects and apply mobile motion fixes
        run: node upgrade-visual.mjs
      - name: Save processed catalogue and visual update
        shell: bash
        run: |
          set -euo pipefail
          cp -R _site/. ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js manifest.webmanifest catalog.json import-report.json cutout-report.json icon-192.png icon-512.png assets cutouts .nojekyll visual-v2.css visual-v2.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish transparent cutouts, larger objects and mobile motion v2'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
